name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Node ${{ matrix.node }} conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run format:check
      - run: npm run conformance -- test/fixtures/valid/minimal-skin.json
